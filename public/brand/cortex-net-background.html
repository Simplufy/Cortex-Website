<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cortex, net background</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #050505;
        overflow: hidden;
      }
      svg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0.3;
      }
    </style>
  </head>
  <body>
    <svg id="net" aria-hidden="true">
      <g id="lines"></g>
      <g id="dots"></g>
    </svg>
    <script>
      const ORANGE = "#ff571f";
      const MAX_LINES = 140;
      const svg = document.getElementById("net");
      const linesG = document.getElementById("lines");
      const dotsG = document.getElementById("dots");
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      let w = 0;
      let h = 0;
      let nodes = [];
      let lineEls = [];
      let dotEls = [];
      let maxDist = 140;
      let raf = 0;

      function seed() {
        w = window.innerWidth;
        h = window.innerHeight;
        svg.setAttribute("viewBox", "0 0 " + w + " " + h);
        const count = Math.max(32, Math.min(58, Math.floor((w * h) / 28000)));
        maxDist = Math.min(170, Math.max(100, Math.min(w, h) * 0.22));
        nodes = Array.from({ length: count }, () => ({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.55,
          vy: (Math.random() - 0.5) * 0.55,
        }));
        linesG.replaceChildren();
        dotsG.replaceChildren();
        lineEls = Array.from({ length: MAX_LINES }, () => {
          const el = document.createElementNS("http://www.w3.org/2000/svg", "line");
          el.setAttribute("stroke", ORANGE);
          el.setAttribute("stroke-width", "0.85");
          el.setAttribute("stroke-linecap", "round");
          el.setAttribute("stroke-opacity", "0");
          linesG.appendChild(el);
          return el;
        });
        dotEls = nodes.map(() => {
          const el = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          el.setAttribute("r", "1.7");
          el.setAttribute("fill", ORANGE);
          dotsG.appendChild(el);
          return el;
        });
      }

      function tick() {
        if (!reduce) {
          for (const n of nodes) {
            n.x += n.vx;
            n.y += n.vy;
            if (n.x < -8) n.x = w + 8;
            if (n.x > w + 8) n.x = -8;
            if (n.y < -8) n.y = h + 8;
            if (n.y > h + 8) n.y = -8;
          }
        }
        let used = 0;
        for (let i = 0; i < nodes.length && used < MAX_LINES; i++) {
          const a = nodes[i];
          for (let j = i + 1; j < nodes.length && used < MAX_LINES; j++) {
            const b = nodes[j];
            const dx = a.x - b.x;
            const dy = a.y - b.y;
            const d2 = dx * dx + dy * dy;
            if (d2 > maxDist * maxDist) continue;
            const d = Math.sqrt(d2);
            const el = lineEls[used++];
            el.setAttribute("x1", String(a.x));
            el.setAttribute("y1", String(a.y));
            el.setAttribute("x2", String(b.x));
            el.setAttribute("y2", String(b.y));
            el.setAttribute("stroke-opacity", String((1 - d / maxDist) * 0.6));
          }
        }
        for (let k = used; k < lineEls.length; k++) lineEls[k].setAttribute("stroke-opacity", "0");
        for (let i = 0; i < nodes.length; i++) {
          dotEls[i].setAttribute("cx", String(nodes[i].x));
          dotEls[i].setAttribute("cy", String(nodes[i].y));
        }
        if (!reduce) raf = requestAnimationFrame(tick);
      }

      seed();
      tick();
      window.addEventListener("resize", () => {
        cancelAnimationFrame(raf);
        seed();
        tick();
      });
    </script>
  </body>
</html>
