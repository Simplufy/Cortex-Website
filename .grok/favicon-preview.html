<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { margin: 0; font-family: sans-serif; }
    .row { display: flex; gap: 24px; align-items: flex-end; padding: 24px; }
    .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; color: #888; font-size: 12px; }
    img { image-rendering: auto; display: block; }
    .dark { background: #111; }
    .light { background: #eee; }
    .mid { background: #5a4630; }
  </style>
</head>
<body>
  <div class="row dark">
    <div class="cell"><img src="favicon.svg.tmp" width="16" height="16" /><span>16 dark</span></div>
    <div class="cell"><img src="favicon.svg.tmp" width="32" height="32" /><span>32</span></div>
    <div class="cell"><img src="favicon.svg.tmp" width="64" height="64" /><span>64</span></div>
    <div class="cell"><img src="favicon.svg.tmp" width="128" height="128" /><span>128</span></div>
  </div>
  <div class="row light">
    <div class="cell"><img src="favicon.svg.tmp" width="16" height="16" /><span>16 light</span></div>
    <div class="cell"><img src="favicon.svg.tmp" width="32" height="32" /><span>32</span></div>
    <div class="cell"><img src="favicon.svg.tmp" width="64" height="64" /><span>64</span></div>
    <div class="cell"><img src="favicon.svg.tmp" width="128" height="128" /><span>128</span></div>
  </div>
  <div class="row mid">
    <div class="cell"><img src="favicon.svg.tmp" width="16" height="16" /><span>16 mid</span></div>
    <div class="cell"><img src="favicon.svg.tmp" width="32" height="32" /><span>32</span></div>
    <div class="cell"><img src="favicon.svg.tmp" width="64" height="64" /><span>64</span></div>
  </div>
</body>
</html>
